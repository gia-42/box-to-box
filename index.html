<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1210">
<meta name="description" content="Quatro jogos diários de futebol: Mata-Mata, Tiki-Taka, Camisa 10 e VAR.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Box to Box">
<title>Box to Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column under floodlights; each game = scoreboard bar → prompt → play area → verdict board → action bar */
:root{
  color-scheme:dark;
  --bg:#0B1210; --surface:#131C19; --raise:#1A2622; --line:#26342F; --fg:#EEF0E9; --muted:#8C9B94;
  --accent:#FFB23F; --accent-ink:#1A1206; --teal:#1FB5A8; --good:#45D17C; --bad:#FF5A4E;
  --paper:#F3EEE2; --paper-edge:#A39C8C; --ink:#111512; --ink-soft:#5E5A50;
  --c1:#1FB5A8; --c2:#FF6B5A; --c3:#F2B63D; --c4:#8A6CF0; --c5:#3A9BF0; --c6:#E2559A; --c7:#5DBB5F;
  --g0:#FFB23F; --g1:#1FB5A8; --g2:#FF6B5A; --g3:#8A6CF0;
  --gold:#F2C14E; --silver:#C4C8C6; --bronze:#C98552; --tin:#7E8B90;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --ui:"Barlow", "Helvetica Neue", Arial, sans-serif;
}
html,body{height:100%}
body{background:radial-gradient(120% 55% at 50% -12%, rgba(255,205,130,.13), transparent 62%) no-repeat, var(--bg);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased}
#app{max-width:440px;margin:0 auto;min-height:100%;padding-inline:16px;display:flex;flex-direction:column}
#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.screen{flex:1;display:flex;flex-direction:column;padding-block:12px 18px;min-height:100%}

/* ---------- bars ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;height:44px;gap:10px}
.bar .right{display:flex;align-items:center;gap:8px}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;border-radius:10px;flex:none}
.iconbtn svg{width:20px;height:20px}
.brand{font:900 clamp(18px,5.3vw,25px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.bar .right{gap:6px!important}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.streak{display:flex;align-items:center;gap:6px;font:800 18px var(--display);font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px}
.streak svg{width:18px;height:18px}
.lang{display:flex;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px}
.lang button{border:0;background:none;font:800 13px/1 var(--ui);letter-spacing:.06em;color:var(--muted);padding:6px 9px;border-radius:999px}
@media (max-width:380px){.lang button{padding:6px 7px}.streak{padding:4px 9px 4px 6px}}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.gtitle{font:900 24px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}

/* ---------- home ---------- */
.eyebrow{font:700 12px var(--ui);color:var(--accent);text-align:center;letter-spacing:.14em;text-transform:uppercase}
.theme{font:900 clamp(50px,15vw,64px)/.9 var(--display);text-align:center;text-transform:uppercase;margin:8px 0 22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border:1px solid var(--line);border-radius:14px;aspect-ratio:1/0.9;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;background:var(--surface);overflow:hidden}
.tile.on{background:linear-gradient(160deg,#FFC566,var(--accent) 55%,#E8901C);color:var(--accent-ink);border-color:transparent}
.tile.on2{background:linear-gradient(160deg,#4FD3C6,var(--teal) 55%,#11887E);color:#04201D;border-color:transparent}
.tile b{font:900 clamp(21px,6.4vw,26px)/.95 var(--display);text-transform:uppercase;white-space:nowrap}
.tile small{font:600 12.5px/1.3 var(--ui);opacity:.78;margin-top:3px}
.tile .ic{position:absolute;top:14px;left:14px;width:58px;height:48px}
.tile.off{color:var(--muted);cursor:default}
.tile.off .ic{opacity:.5}
.tile .soon{position:absolute;top:12px;right:12px;font:700 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.tile .mini-award{position:absolute;top:10px;right:10px;width:30px}
.note{font:500 13.5px/1.45 var(--ui);color:var(--muted);text-align:center;margin:18px auto 0;max-width:32ch}
.nav{margin:auto auto 0;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:none;border-radius:999px;padding:8px 22px;font:700 12px var(--ui);display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);letter-spacing:.04em}
.nav button svg{width:18px;height:18px}
.nav button[aria-current="page"]{background:var(--raise);color:var(--fg)}
.spacer{flex:1;min-height:18px}

/* ---------- archive ---------- */
.h1{font:900 46px/.95 var(--display);text-transform:uppercase;margin:10px 0 6px}
.lede{color:var(--muted);font-size:14px;margin:0 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font:900 18px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;text-align:left}
.row .num{font:800 20px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.row .tt{min-width:0}
.row .tt b{display:block;font:800 21px/1 var(--display);text-transform:uppercase}
.row .tt span{display:block;font:500 12.5px/1.3 var(--ui);color:var(--muted);margin-top:3px}
.chip{font:700 12px var(--ui);border-radius:999px;padding:6px 12px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.chip.done{background:var(--raise);color:var(--fg);display:flex;align-items:center;gap:6px}
.chip.done svg{width:16px;height:auto}

/* ---------- intro ---------- */
.intro-scr{text-align:center}
.intro-scr .eyebrow{margin-top:26px}
.intro-scr h1{font:900 clamp(40px,12vw,50px)/.92 var(--display);text-transform:uppercase;margin:10px auto 10px;text-wrap:balance;max-width:12ch}
.intro-scr p{font:500 14.5px/1.45 var(--ui);margin:0 auto;max-width:34ch;color:var(--muted)}
.decks{display:flex;justify-content:center;gap:clamp(16px,6vw,28px);margin:auto 0;padding-block:36px}
.back{width:min(36vw,132px);aspect-ratio:5/7;border-radius:12px;border:5px solid var(--paper);box-shadow:0 6px 0 -2px #2B3A34,0 12px 0 -5px #1C2824,0 22px 30px rgba(0,0,0,.5)}
.back.a{background:
  linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.9)) center/100% 2px no-repeat,
  radial-gradient(circle at 50% 50%, transparent 0 24%, rgba(255,255,255,.9) 24.5% 26.5%, transparent 27%),
  radial-gradient(circle at 50% 50%, #fff 0 3%, transparent 3.5%),
  repeating-linear-gradient(0deg,#2E7D46 0 12.5%,#378C50 12.5% 25%);transform:rotate(-4deg);animation:bob 3.4s ease-in-out infinite}
.back.b{background:
  radial-gradient(circle at 0 0, transparent 0 20%, var(--ink) 20.5% 23%, transparent 23.5%),
  radial-gradient(circle at 100% 0, transparent 0 20%, var(--ink) 20.5% 23%, transparent 23.5%),
  radial-gradient(circle at 0 100%, transparent 0 20%, var(--ink) 20.5% 23%, transparent 23.5%),
  radial-gradient(circle at 100% 100%, transparent 0 20%, var(--ink) 20.5% 23%, transparent 23.5%),
  radial-gradient(circle at 50% 50%, var(--ink) 0 9%, transparent 9.5%),
  var(--accent);transform:rotate(4deg);animation:bob 3.4s ease-in-out -1.7s infinite}
@keyframes bob{50%{translate:0 -7px}}

/* ---------- buttons ---------- */
.actions{display:flex;gap:8px;align-items:center}
.btn{flex:1;height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:900 21px var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s,box-shadow .15s;box-shadow:0 4px 0 #A8661A;padding-inline:10px}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #A8661A}
.btn svg{width:18px;height:18px}
.btn:disabled{background:var(--raise);color:#56645E;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:disabled{color:#56645E}
.hintbtn{flex:0 0 76px;position:relative;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);box-shadow:none;font-size:18px}
.hintbtn .cnt{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);font:800 12px/22px var(--ui);text-align:center;letter-spacing:0}
.hintbtn:disabled .cnt{background:var(--line);color:var(--muted)}
.textbtn{border:0;background:none;font:800 18px var(--display);letter-spacing:.08em;text-transform:uppercase;height:46px;margin-top:4px;color:var(--muted)}

/* ---------- mata-mata ---------- */
.board{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;min-width:0}
.board .rd{text-transform:uppercase;font:800 18px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:.04em}
.pips{display:flex;gap:3px}
.pip{width:9px;height:14px;border-radius:2px;background:var(--line)}
.pip.ok{background:var(--good)}
.pip.bad{background:var(--bad)}
.pip.now{background:var(--fg);opacity:.7}
.q{font:900 clamp(34px,10.4vw,44px)/.93 var(--display);text-align:center;text-transform:uppercase;text-wrap:balance;margin:22px auto 0;max-width:13ch}
.arena{position:relative;display:flex;justify-content:center;gap:clamp(12px,4.5vw,22px);padding-top:28px;padding-bottom:32px}
.arena::before{content:"";position:absolute;inset:6px -16px 0;background:
  linear-gradient(rgba(238,240,233,.07),rgba(238,240,233,.07)) center/1.5px 100% no-repeat,
  radial-gradient(circle at 50% 50%, transparent 0 74px, rgba(238,240,233,.07) 74.5px 76px, transparent 76.5px);pointer-events:none}
.slot{position:relative;border:0;background:none;padding:0;width:min(42vw,158px);transition:transform .22s cubic-bezier(.2,.9,.3,1.2);-webkit-tap-highlight-color:transparent}
.slot[disabled]{cursor:default}

/* sticker card: label strip / kit window / name plate */
.card{--depth:0 6px 0 -2px #2B3A34,0 12px 0 -5px #1C2824,0 22px 30px rgba(0,0,0,.5);
  aspect-ratio:5/7;border-radius:12px;background:var(--paper);padding:5px;display:flex;flex-direction:column;box-shadow:var(--depth);color:var(--ink);text-align:left;transition:box-shadow .2s}
.card .meta{height:2.3em;display:flex;align-items:flex-end;padding:0 3px 4px;font:700 9.5px/1.15 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.card .photo{position:relative;flex:1;min-height:0;border-radius:7px 7px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.22) 0 1.4px, transparent 1.9px) 0 0/9px 9px, radial-gradient(90% 70% at 50% 45%, rgba(255,255,255,.28), transparent 70%), var(--c)}
.card .photo::after{content:"";position:absolute;left:22%;right:22%;bottom:9%;height:8%;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(3px)}
.card .photo svg{position:relative;z-index:1;width:68%;max-height:84%;height:auto;display:block}
.card .plate{background:var(--ink);color:var(--paper);border-radius:0 0 7px 7px;padding:7px 7px 8px;font:900 clamp(17px,5vw,21px)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em;height:2.75em;display:flex;align-items:center;overflow:hidden}
.card .plate.long{font-size:clamp(14px,4.2vw,17px)}
.slot.sel{transform:translateY(-14px) rotate(-2deg)}
.slot.sel[data-side="R"]{transform:translateY(-14px) rotate(2deg)}
.slot.sel .card{box-shadow:0 0 0 3px var(--accent),0 0 28px rgba(255,178,63,.45),var(--depth)}
.slot .caret{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);width:34px;height:4px;border-radius:2px;background:var(--accent);opacity:0;transition:opacity .15s}
.slot.sel .caret{opacity:1}
.slot.win .card{box-shadow:0 0 0 4px var(--good),0 0 26px rgba(69,209,124,.35),var(--depth)}
.slot.wrong .card{box-shadow:0 0 0 4px var(--bad),var(--depth)}
.badge{position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;display:none;place-items:center;z-index:2}
.badge svg{width:15px;height:15px}
.slot.win .badge{display:grid;background:var(--good);color:var(--ink)}
.slot.wrong .badge{display:grid;background:var(--bad);color:#fff}
.slot.out .card,.slot.out .badge{animation:out .3s ease-in forwards}
.slot.in .card{animation:cin .42s cubic-bezier(.2,.9,.3,1.25)}
@keyframes out{to{transform:translateY(40px) rotate(12deg) scale(.82);opacity:0}}
@keyframes cin{from{transform:translateY(-26px) scale(.8) rotate(-8deg);opacity:0}}
.verdict{min-height:176px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;margin-top:auto;padding-bottom:14px}
.verdict h2{font:900 34px/.9 var(--display);text-transform:uppercase;text-align:center;margin:0;letter-spacing:.02em}
.verdict h2.ok{color:var(--good)}
.verdict h2.no{color:var(--bad)}
.verdict h2 small{display:block;font:600 12px var(--ui);letter-spacing:.14em;color:var(--muted);margin-top:4px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;font:500 15.5px/1.45 var(--ui);text-align:center;text-wrap:pretty}
.box .vals{display:flex;flex-direction:column;align-items:center;gap:3px;font:800 16px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px;font-variant-numeric:tabular-nums}
.box .vals em{font-style:normal;color:var(--muted)}
.box .vals .w{color:var(--good)}
.box .vals .out{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--bad)}
.box .lbl{display:block;font:700 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.prompt{font:600 14px var(--ui);text-align:center;color:var(--muted);padding-bottom:6px;letter-spacing:.02em}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* ---------- tiki-taka (links board) ---------- */
.tk-wrap{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0}
.tk-theme{font:700 12px var(--ui);color:var(--accent);letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-top:6px}
.tk-board{position:relative;margin:10px auto 0;flex:none}
.tk-bar{position:absolute;background:var(--line);border-radius:2px;transition:background .25s}
.tk-clue{box-sizing:border-box;position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;text-align:center;font:600 12px/1.12 var(--ui);border:3px solid var(--line);overflow:hidden;z-index:2;text-wrap:balance;transition:border-color .25s}
.tk-clue.done{border-color:var(--good)}
.tk-slot{box-sizing:border-box;position:absolute;transform:translate(-50%,-50%);border-radius:10px;border:2px dashed #3C4C46;background:var(--bg);z-index:3;padding:0;touch-action:none}
.tk-slot.filled{border:0;background:none}
.tk-slot.target{border:2px solid var(--accent);background:rgba(255,178,63,.12)}
.tk-slot .card{width:100%;height:100%;aspect-ratio:auto;padding:3px;border-radius:9px;--depth:0 6px 14px rgba(0,0,0,.45)}
.tk-slot .card .photo{border-radius:6px 6px 0 0}
.tk-slot .card .plate{height:auto;min-height:2.3em;padding:4px 4px 5px;font-size:13px;border-radius:0 0 6px 6px}
.tk-slot.locked .card{box-shadow:0 0 0 3px var(--good),var(--depth)}
.tk-slot.wrong .card{box-shadow:0 0 0 3px var(--bad),var(--depth)}
.tk-slot .tick.bad{background:var(--bad);color:#fff}
.tk-board.shake{animation:shake .38s}
.tk-slot .tick{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--good);color:var(--ink);display:grid;place-items:center;z-index:4}
.tk-slot .tick svg{width:12px;height:12px}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.tk-deck{position:relative;flex:none;height:168px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;margin-top:auto;padding-top:12px}
.tk-deck .pile{position:relative;width:110px;height:146px;touch-action:none;cursor:grab;border:0;background:none;padding:0}
.tk-deck .pile .card{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;--depth:0 10px 22px rgba(0,0,0,.5)}
.tk-deck .pile .card .plate{font-size:16px;height:auto;min-height:2.3em}
.tk-deck .pile .under{position:absolute;inset:0;border-radius:12px;background:var(--paper);border:1px solid var(--paper-edge)}
.tk-deck .count{position:absolute;left:calc(50% - 74px);top:12px;font:800 15px var(--display);color:var(--muted);display:flex;gap:4px;align-items:center}
.tk-deck .tip{font:500 12px/1.3 var(--ui);color:var(--muted);margin:8px 0 10px;text-align:center;max-width:30ch}
.tk-ghost{position:fixed;z-index:50;pointer-events:none;width:90px;height:118px;transform:translate(-50%,-60%) rotate(-4deg)}
.tk-ghost .card{width:100%;height:100%;aspect-ratio:auto;--depth:0 18px 30px rgba(0,0,0,.6)}
.tk-ghost .card .plate{font-size:13px;height:auto;min-height:2.3em}
.tk-done{width:100%;text-align:center;margin-top:auto;padding-top:14px}
.tk-done h2{font:900 38px/.9 var(--display);text-transform:uppercase;color:var(--good);margin:0}
.tk-done p{color:var(--muted);font:500 14px var(--ui);margin:6px 0 14px}
.tk-actions{width:100%}
.tk-intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ri);color:var(--ink);overflow:hidden;cursor:pointer;animation:fade .3s ease}
.tk-intro .eyebrow{color:rgba(17,21,18,.7)}
.tk-intro h1{font:900 clamp(56px,17vw,80px)/.88 var(--display);text-transform:uppercase;margin:8px 0 0;text-align:center;position:relative;z-index:2}
.tk-intro h1 small{display:block;font-size:.45em;opacity:.7}
.tk-intro .fly{position:absolute;width:104px;height:138px}
.tk-intro .fly .card{width:100%;height:100%;aspect-ratio:auto}
.tk-intro .fly .card .plate{font-size:15px;height:auto;min-height:2.3em}
.tk-intro .go{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));font:700 13px var(--ui);letter-spacing:.12em;text-transform:uppercase;opacity:.65}

/* ---------- results ---------- */
.result{text-align:center;position:relative}
.result .date{display:flex;align-items:center;justify-content:center;gap:6px;font:600 13px var(--ui);color:var(--muted);margin-top:16px;letter-spacing:.06em;text-transform:uppercase}
.result .date svg{width:15px;height:15px}
.result h1{font:900 40px/.95 var(--display);text-transform:uppercase;margin:6px 0 0}
.award{width:min(48vw,184px);margin:18px auto 4px;animation:pop .7s cubic-bezier(.2,.9,.3,1.4);filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
@keyframes pop{from{transform:scale(.4) rotate(-25deg);opacity:0}}
.award svg,.mini-award svg{width:100%;height:auto;display:block}
.result h2{font:900 44px/.95 var(--display);text-transform:uppercase;margin:6px 0 18px;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px 9px;min-width:0}
.stat span{display:block;font:700 10.5px var(--ui);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.stat b{font:900 30px/1.05 var(--display);font-variant-numeric:tabular-nums}
.beams{position:absolute;inset:-12px -16px auto;height:340px;pointer-events:none;background:
  conic-gradient(from 160deg at 12% 0%, transparent 0 8deg, rgba(255,214,150,.07) 8deg 20deg, transparent 20deg 360deg),
  conic-gradient(from 180deg at 88% 0%, transparent 0 4deg, rgba(255,214,150,.07) 4deg 16deg, transparent 16deg 360deg)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font:700 14px var(--ui);padding:10px 16px;border-radius:999px;z-index:20;white-space:nowrap}
.sharebox{width:100%;margin-top:10px;font:500 13px/1.4 var(--ui);border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--fg);resize:none}

/* ---------- recap ---------- */
.recap .q2{font:600 15px var(--ui);color:var(--muted);margin:0 0 16px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 16px 20px;margin-inline:-16px;scroll-snap-type:x proximity}
.strip .mini{flex:0 0 112px;scroll-snap-align:start}
.mini .card{--depth:0 10px 18px rgba(0,0,0,.45);padding:4px}
.mini .card .plate{font-size:15px}
.mini .card .plate.long{font-size:13px}
.mini .card .meta{font-size:8px}
.mini .val{display:block;font:800 17px var(--display);margin-top:10px;text-align:center;font-variant-numeric:tabular-nums;text-transform:uppercase;color:var(--accent)}
.axis{display:flex;align-items:center;gap:8px;font:700 11px var(--ui);color:var(--muted);margin-bottom:18px;letter-spacing:.1em;text-transform:uppercase}
.axis i{flex:1;height:1.5px;background:var(--muted);position:relative}
.axis i::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--muted);border-right:0}
.spot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.spot h3{margin:0;padding:11px 14px;background:var(--raise);font:900 24px/1 var(--display);text-transform:uppercase}
.spot h3 span{color:var(--accent)}
.spot ol{margin:0;padding:12px 14px 12px 34px;font:500 14.5px/1.45 var(--ui)}
.spot li{padding-block:3px}

/* ---------- guess history (tiki-taka) ---------- */
.tk-hist{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:12px;min-height:26px}
.tk-hist .lb{font:700 10.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.tk-hist .hg{display:flex;gap:2px;padding:3px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.tk-hist i{width:14px;height:19px;border-radius:3px;display:grid;place-items:center;font:900 10px/1 var(--ui);font-style:normal}
.tk-hist i.ok{background:var(--good);color:var(--ink)}
.tk-hist i.no{background:var(--bad);color:#fff}
.tk-hist .hg.new{animation:pop .35s ease}

/* ---------- ball knowledge ---------- */
.know{margin-top:16px;text-align:center}
.know h3,.sec h3{font:700 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kchips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.kchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 6px;font:600 13px var(--ui);animation:fade .4s ease both}
.kchip svg{width:18px;height:18px}
.kchip b{color:var(--good);font-weight:800}
.know p{margin:0;color:var(--muted);font:500 13px var(--ui)}

/* ---------- stats ---------- */
.sec{margin-top:18px}
.ov{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ov .stat b{font-size:34px}
.gcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gcard + .gcard{margin-top:8px}
.gcard .top{display:flex;justify-content:space-between;align-items:baseline}
.gcard .top b{font:900 24px var(--display);text-transform:uppercase}
.gcard .top span{font:600 12px var(--ui);color:var(--muted)}
.gnums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.gnums div span{display:block;font:700 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gnums div b{font:900 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.dist{display:flex;gap:6px;justify-content:space-between}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:800 15px var(--display);font-variant-numeric:tabular-nums}
.dist svg{width:26px;height:auto}
.dist div.zero{opacity:.35}
.kbars{display:flex;flex-direction:column;gap:7px}
.kbar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 2.2em;align-items:center;gap:8px;font:600 13px var(--ui)}
.kbar .tr{height:10px;border-radius:5px;background:var(--raise);overflow:hidden}
.kbar .tr i{display:block;height:100%;background:var(--good);border-radius:5px}
.kbar b{text-align:right;font:800 15px var(--display);font-variant-numeric:tabular-nums}
.spec{font:600 13px var(--ui);color:var(--muted);margin:0 0 10px}
.spec b{color:var(--accent)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.hrow svg{width:28px;height:auto}
.hrow .tt{min-width:0}
.hrow .tt b{display:block;font:800 17px/1 var(--display);text-transform:uppercase}
.hrow .tt span{display:block;font:500 12px var(--ui);color:var(--muted);margin-top:2px}
.hrow .pc{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.acct{border:1px dashed #3C4C46;border-radius:12px;padding:14px;text-align:center}
.acct b{display:block;font:900 22px var(--display);text-transform:uppercase}
.acct p{margin:4px 0 10px;color:var(--muted);font:500 13.5px/1.4 var(--ui)}
.acct .btn{display:inline-flex;width:auto;padding-inline:22px;height:44px;font-size:18px}
.empty{color:var(--muted);font:500 14px var(--ui);text-align:center;padding:20px 0}
.tile.wait{color:var(--muted);cursor:default}
.nav button{padding:8px 16px}

/* ---------- camisa 10 ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.c10-target{display:grid;grid-template-columns:84px 1fr;grid-template-areas:"shirt who" "known known";gap:10px 14px;align-items:center;margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px}
.c10-shirt{grid-area:shirt;width:84px;height:84px;border-radius:10px;background:radial-gradient(90% 70% at 50% 45%,rgba(255,255,255,.12),transparent 70%),var(--raise);display:grid;place-items:center}
.c10-shirt svg{width:70%;height:auto}
.c10-who{grid-area:who;min-width:0}
.c10-who .eyebrow{text-align:left;display:block}
.c10-who h1{font:900 30px/.95 var(--display);text-transform:uppercase;margin:4px 0 0;text-wrap:balance}
.c10-known{grid-area:known;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.c10-k{border:1px dashed #3C4C46;border-radius:10px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.c10-k .ic svg{width:20px;height:20px;color:var(--muted)}
.c10-k .lb{font:700 9.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.c10-k b{font:800 12px/1.15 var(--display);text-transform:uppercase;overflow-wrap:normal;word-break:normal;max-width:100%}
.c10-k.r{border:1.5px solid var(--good);background:rgba(69,209,124,.1)}
.c10-k.r .ic svg{color:var(--good)}
.c10-k.c{border:1.5px solid var(--accent);background:rgba(255,178,63,.1)}
.c10-k.c .ic svg{color:var(--accent)}
.c10-input{position:relative;margin-top:12px}
.c10-irow{display:flex;gap:6px}
.c10-hint{flex:none;width:70px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:800 14px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.c10-hint svg{width:18px;height:18px}
.c10-hint small{font:600 10px var(--ui);text-transform:none;letter-spacing:0;color:var(--muted)}
.c10-hint:disabled{color:#56645E;cursor:default}
.c10-letter{display:block;margin-top:6px;font:600 13px var(--ui);color:var(--muted)}
.c10-letter b{color:var(--accent);font:900 18px var(--display)}
.c10-cell .yr{font:900 15px var(--display);display:flex;align-items:center;gap:3px}
.c10-cell .yr b{font-size:17px}
.c10-left .pp i.hint{background:var(--accent)}
.c10-input input{flex:1;min-width:0;width:100%;box-sizing:border-box;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:600 17px var(--ui);padding:0 14px}
.c10-input input:focus{outline:none;border-color:var(--accent)}
.c10-sug{list-style:none;margin:4px 0 0;padding:0;position:absolute;left:0;right:0;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 18px 30px rgba(0,0,0,.5)}
.c10-sug:empty{display:none}
.c10-sug li{padding:10px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-top:1px solid var(--line)}
.c10-sug li:first-child{border-top:0}
.c10-sug li:hover,.c10-sug li:first-child{background:var(--raise)}
.c10-sug li b{font:800 17px var(--display);text-transform:uppercase}
.c10-sug li span{font:500 12.5px var(--ui);color:var(--muted);text-align:right}
.c10-sug li.none{color:var(--muted);font:500 13px var(--ui);cursor:default}
.c10-left{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 4px;font:600 13px var(--ui);color:var(--muted)}
.c10-left .pp{display:flex;gap:4px}
.c10-left .pp i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.c10-left .pp i.used{background:var(--bad)}
.c10-left .pp i.ok{background:var(--good)}
.c10-left .btn{flex:1}
.c10-guesses{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.c10-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px}
.c10-row.win{border-color:var(--good)}
.c10-row .nm{grid-column:1/-1;font:900 19px/1 var(--display);text-transform:uppercase;padding:0 2px 2px}
.c10-cell{border-radius:9px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font:700 11.5px/1.15 var(--ui);min-width:0;overflow-wrap:anywhere}
.c10-cell .ic svg{width:22px;height:22px}
.c10-cell .pz svg{width:18px;height:auto;display:block}
.c10-cell.r{background:var(--good);color:var(--ink)}
.c10-cell.c{background:var(--accent);color:var(--accent-ink)}
.c10-cell.w{background:#3A2422;color:#F2C9C5}
.c10-clubs{font:500 13.5px/1.45 var(--ui);color:var(--muted);text-align:center;margin:12px auto 0;max-width:36ch}
.tile.on3{background:linear-gradient(160deg,#FF8D7E,var(--c2) 55%,#D9483A);color:#2A0B07;border-color:transparent}
.seg3 button{font-size:15px;padding:9px 4px;white-space:nowrap}
.kg{font:700 11px var(--ui);color:var(--fg);margin:14px 0 6px;letter-spacing:.04em}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(3,6,5,.7);display:grid;place-items:center;padding:16px;z-index:30}
.sheet{background:var(--surface);color:var(--fg);border-radius:16px;max-width:400px;width:100%;padding:22px 20px 18px;border:1px solid var(--line)}
.sheet h2{font:900 36px/1 var(--display);text-transform:uppercase;margin:0 0 10px}
.sheet ol{padding-left:20px;margin:0 0 16px;font:500 15px/1.5 var(--ui)}
.sheet li{padding-block:2px}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- VAR ---------- */
.tile.on4{background:linear-gradient(160deg,#8EC5FF,var(--c5) 55%,#1E6CBF);color:#04162B;border-color:transparent}
body.lock{overflow:hidden}
.var-photo{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#000;border:1px solid var(--line);cursor:zoom-in}
.var-photo img{width:100%;height:100%;object-fit:cover;display:block}
.var-zoomic{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;background:rgba(11,18,16,.72);display:grid;place-items:center;color:var(--fg)}
.var-zoomic svg{width:16px;height:16px}
.var-hints{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
.var-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(11,18,16,.82);border:1px solid var(--accent);color:var(--fg);border-radius:999px;padding:4px 10px 4px 8px;font:700 12.5px var(--ui)}
.var-chip svg{width:14px;height:14px;color:var(--accent)}
.var-q{font:800 19px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;text-align:center;margin:12px 0 8px}
.var-mapbtn{position:relative;display:block;width:100%;height:132px;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:none}
.var-mapbtn .wm-host{position:absolute;inset:0}
.var-mapcta{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--fg);color:var(--bg);border-radius:999px;padding:7px 14px 7px 10px;font:700 13px var(--ui);white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.var-mapcta svg{width:14px;height:18px;color:var(--accent)}
.var-mapcta.set{background:var(--accent);color:var(--accent-ink)}
.var-mapcta.set svg{color:var(--accent-ink)}
.var-year{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;margin-top:12px}
.var-year .iconbtn{width:44px;height:44px;touch-action:manipulation;user-select:none}
.var-year .yv{text-align:center;display:flex;flex-direction:column;align-items:center}
.var-year .yv span{font:700 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.var-year .yv b{font:900 46px/.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.var-range{width:100%;margin:10px 0 0;accent-color:var(--accent);height:28px}
.var-scale{display:flex;justify-content:space-between;font:600 11px var(--ui);color:var(--muted);margin-top:-2px}
.var-actions{display:flex;gap:8px;margin-top:12px}
.var-actions .c10-hint{height:52px}
/* map */
.wm{position:relative;overflow:hidden;background:#0F2533;user-select:none;-webkit-user-select:none}
.wm.live{touch-action:none;cursor:crosshair}
.wm-geo,.wm-ov{position:absolute;inset:0;width:100%;height:100%;display:block}
.wm-geo .sea{fill:#0F2533}
.wm-geo .land{fill:#2A3F33;stroke:#4C6A5A;stroke-width:.8;vector-effect:non-scaling-stroke}
.wm-geo .lk{stroke:#3C5A4C;stroke-width:.6;vector-effect:non-scaling-stroke}
.wm-geo .bd{fill:none;stroke:#5A7A6A;stroke-width:.7;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.wm-ov text{paint-order:stroke;stroke:#0B1210;stroke-width:3px;stroke-linejoin:round}
.wm-ov .cl{font:700 9.5px var(--ui);letter-spacing:.11em;fill:#7E9188}
.wm-ov .cn{font:600 11px var(--ui);fill:#D5DDD8}
.wm-ov .cd{fill:#D5DDD8;stroke:#0B1210;stroke-width:1.2}
.wm-ov .pin path{stroke:#0B1210;stroke-width:1.6}
.wm-ov .pin.guess path{fill:var(--accent)}
.wm-ov .pin.ans path{fill:var(--good)}
.wm-ov .pin circle{fill:#0B1210}
.wm-ov .pin .sh{fill:rgba(0,0,0,.45);stroke:none}
.wm-ov .dash{stroke:#fff;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round}
.wm-ov .ring{fill:rgba(69,209,124,.14);stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 3}
.wm-zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.wm-zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(19,28,25,.92);color:var(--fg);font:800 22px/1 var(--ui);display:grid;place-items:center;touch-action:manipulation}
.wm-full{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.wm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.wm-top b{font:900 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.wm-thumb{width:56px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.wm-host.big{flex:1;border-block:1px solid var(--line)}
.wm-bottom{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-width:440px;width:100%;margin:0 auto;box-sizing:border-box}
.wm-bottom p{margin:0;text-align:center;font:600 13.5px var(--ui);color:var(--muted)}
.wm-bottom .btn{flex:none;width:100%}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox .iconbtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
/* result */
.stat.lv-cup b{color:var(--gold)}.stat.lv-g b{color:var(--good)}.stat.lv-s b{color:#B9E26B}.stat.lv-b b{color:var(--accent)}.stat.lv-o b{color:var(--bad)}
.var-res{position:relative;margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.wm-host.res{height:230px}
.var-expand{position:absolute;left:8px;top:8px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(19,28,25,.92);color:var(--fg);display:grid;place-items:center;z-index:2}
.var-expand svg{width:17px;height:17px}
.var-legend{display:flex;flex-direction:column;gap:5px;padding:10px 12px;font:500 13px/1.35 var(--ui);color:var(--muted);text-align:left}
.var-legend b{color:var(--fg);font-weight:800}
.var-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.lg-g{background:var(--accent)}.lg-a{background:var(--good)}
.var-fig{margin:14px 0 0}
.var-fig img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.var-fig figcaption{font:500 11.5px var(--ui);color:var(--muted);margin-top:5px;text-align:right}
.var-txt{font:500 15.5px/1.5 var(--ui);color:var(--fg);margin:12px 0 0;text-align:left}
.stats.vs .stat b{display:block;white-space:nowrap;overflow:hidden;padding-inline:2px}
#app.wide{max-width:1000px}
.var-pick .wm-host.pick{border-radius:14px;border:1px solid var(--line);margin-top:10px}
.wm-tip{text-align:center;font:600 13.5px/1.4 var(--ui);color:var(--muted);margin:10px auto;max-width:44ch}
.var-pick .btn{flex:none;width:100%;max-width:440px;margin:0 auto}
button.wm-thumb{width:56px;height:42px;padding:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000;flex:none;cursor:zoom-in}
button.wm-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pv{position:relative;overflow:hidden;background:#000;border-radius:14px;margin-top:10px;touch-action:none;cursor:zoom-in;aspect-ratio:4/3;max-height:calc(100vh - 140px);user-select:none;-webkit-user-select:none}
.pv.zoomed{cursor:grab}
.pv img{width:100%;height:100%;object-fit:contain;transform-origin:0 0;display:block;pointer-events:none}
.pv:fullscreen{border-radius:0;margin:0;width:100%;height:100%;max-height:none;aspect-ratio:auto}
.pv .pv-x{display:none}.pv:fullscreen .pv-x{display:grid;font-size:17px}

   is what an account backend would store, so syncing later only needs to upload these records. */
function bestStreak(){const on=n=>R('mm',n)?.onDay||R('tt',n)?.onDay||R('c10',n)?.onDay||R('var',n)?.onDay;let best=0,cur=0;for(let n=1;n<=todayNum();n++){cur=on(n)?cur+1:0;best=Math.max(best,cur)}return best}
const GAMES=[{g:'mm',name:'Mata-Mata'},{g:'tt',name:'Tiki-Taka'},{g:'c10',name:'Camisa 10'},{g:'var',name:'VAR'}];
function gamePen(g,r){return g==='mm'?r.marks.filter(v=>!v).length:g==='tt'?tkPen(r):g==='var'?varPen(r):c10Pen(r)}
function gameAcc(g,r){return g==='mm'?Math.round(r.marks.reduce((a,b)=>a+b,0)/r.marks.length*100):g==='tt'?tkAcc(r):(r.win?100:0)}
function gameDay(g,n){return g==='mm'?mmP(n):g==='tt'?tkDay(n):g==='var'?varDay(n):c10Day(n)}
function gameStats(g){
 const rows=Object.keys(store.res).filter(k=>k.startsWith(g)&&/^\d+$/.test(k.slice(g.length))).map(k=>({n:+k.slice(g.length),r:store.res[k]}));
 const dist={cup:0,1:0,2:0,3:0,out:0};rows.forEach(({r})=>{const t=tier(gamePen(g,r));dist[t.k==='medal'?t.n:t.k]++});
 const avg=f=>rows.length?rows.reduce((a,{r})=>a+f(r),0)/rows.length:0;
 return {rows,dist,played:rows.length,avgAcc:Math.round(avg(r=>gameAcc(g,r))),avgPen:avg(r=>gamePen(g,r)),avgGuess:avg(r=>r.guesses?r.guesses.length:0),avgKm:avg(r=>r.km||0),avgYd:avg(r=>r.yd||0)};
}
function stats(){REDRAW=stats;
 const S={};GAMES.forEach(({g})=>S[g]=gameStats(g));
 const all=GAMES.flatMap(({g})=>S[g].rows.map(x=>({...x,g})));
 const days=new Set(all.map(x=>x.n)).size,trophies=GAMES.reduce((a,{g})=>a+S[g].dist.cup,0);
 const num=v=>v.toFixed(1).replace('.',LANG==='pt'?',':'.');
 const distHTML=d=>`<div class="dist">${[['cup',trophySVG()],[1,medalSVG(tier(1))],[2,medalSVG(tier(3))],[3,medalSVG(tier(5))],['out',outSVG()]].map(([k,svg])=>`<div class="${d[k]?'':'zero'}">${svg}${d[k]}</div>`).join('')}</div>`;
 const gcard=({g,name})=>{const G=S[g],c10=g==='c10',vr=g==='var';
  const a=vr?[T('Avg distance','Distância média'),G.played?fmtKm(G.avgKm):'–']:c10?[T('Win rate','Aproveitamento'),G.played?G.avgAcc+'%':'–']:[T('Avg accuracy','Média de acertos'),G.played?G.avgAcc+'%':'–'];
  const b=vr?[T('Avg years off','Média de anos'),G.played?num(G.avgYd):'–']:c10?[T('Avg guesses','Média de chutes'),G.played?num(G.avgGuess):'–']:[T('Avg mistakes','Média de erros'),G.played?num(G.avgPen):'–'];
  return `<div class="gcard"><div class="top"><b>${name}</b><span>${G.played} ${G.played===1?T('game','jogo'):T('games','jogos')}</span></div>
  <div class="gnums"><div><span>${a[0]}</span><b>${a[1]}</b></div><div><span>${b[0]}</span><b>${b[1]}</b></div><div><span>${T('Trophies','Troféus')}</span><b>${G.dist.cup}</b></div></div>${distHTML(G.dist)}</div>`};
 // Ball knowledge, grouped into topics, countries, continents and decades
 const know=Object.entries(store.know).filter(([k])=>topicLabel(k)).sort((a,b)=>b[1]-a[1]),kmax=know.length?know[0][1]:1;
 const groups=[['topic',T('Topics','Temas')],['country',T('Countries','Países')],['continent',T('Continents','Continentes')],['decade',T('Decades','Décadas')]];
 const bars=list=>`<div class="kbars">${list.map(([k,v])=>`<div class="kbar"><span>${topicLabel(k)}</span><span class="tr"><i style="width:${Math.max(6,v/kmax*100)}%"></i></span><b>${v}</b></div>`).join('')}</div>`;
 const knowHTMLs=know.length?`<p class="spec">${T('Your specialty','Sua especialidade')}: <b>${topicLabel(know[0][0])}</b></p>`+groups.map(([cat,lb])=>{const l=know.filter(([k])=>topicCat(k)===cat);return l.length?`<h4 class="kg">${lb}</h4>${bars(l)}`:''}).join(''):`<p class="empty">${T('Win medals to earn ball knowledge.','Ganhe medalhas para somar conhecimento de bola.')}</p>`;
 const hist=all.sort((a,b)=>b.n-a.n||GAMES.findIndex(x=>x.g===a.g)-GAMES.findIndex(x=>x.g===b.g));
 const label=h=>{const d=gameDay(h.g,h.n);return h.g==='c10'?plBy(d.p)[0]:h.g==='var'?L(d.title):L(d.theme)};
 app.innerHTML=`<section class="screen"><div class="bar"><span class="brand"><i></i>Box to Box</span><div class="right">${langToggle()}${acctBtn()}<span class="streak">${ICON.flame}${streak()}</span></div></div>
  <h1 class="h1">${T('Stats','Números')}</h1><p class="lede">${(session?T('Your games, saved to your account.','Seus jogos, salvos na sua conta.'):T('Your games on this device.','Seus jogos neste aparelho.'))}</p>
  ${days?`<div class="ov"><div class="stat"><span>${T('Days played','Dias jogados')}</span><b>${days}</b></div><div class="stat"><span>${T('Trophies','Troféus')}</span><b>${trophies}</b></div><div class="stat"><span>${T('Current streak','Sequência atual')}</span><b>${streak()}</b></div><div class="stat"><span>${T('Best streak','Melhor sequência')}</span><b>${bestStreak()}</b></div></div>
  <div class="sec"><h3>${T('By game','Por jogo')}</h3>${GAMES.map(gcard).join('')}</div>
  <div class="sec"><h3>${T('Ball knowledge','Conhecimento de bola')}</h3>${knowHTMLs}</div>
  <div class="sec"><h3>${T('History','Histórico')}</h3><div class="hist">${hist.map(h=>`<button class="hrow row" data-g="${h.g}" data-n="${h.n}" style="grid-template-columns:30px 1fr auto">${award(gamePen(h.g,h.r))}<span class="tt"><b>${GAMES.find(x=>x.g===h.g).name} · ${label(h)}</b><span>${fmtDate(dateOf(h.n))}</span></span><span class="pc">${h.g==='var'?fmtKm(h.r.km):h.g==='c10'?(h.r.win?h.r.guesses.length:'✗')+'/'+C10_MAX:gameAcc(h.g,h.r)+'%'}</span></button>`).join('')}</div></div>`
  :`<p class="empty">${T("Play today's games to start your stats.","Jogue os desafios de hoje para começar suas estatísticas.")}</p>`}
  ${acctCard()}
  <div class="spacer"></div>${nav('stats')}</section>`;
 document.querySelectorAll('.hrow').forEach(b=>b.onclick=()=>{const n=+b.dataset.n,g=b.dataset.g;(g==='mm'?mmResult:g==='tt'?ttResult:g==='var'?varResult:c10Result)(n)});
 bindLang(stats);bindNav();$('#acctGo')&&($('#acctGo').onclick=accountScreen);
}

 if(G.revealed||G.hintShown||!G.hintsLeft)return;
 G.hintsLeft--;G.hintShown=true;
 const it=G.fresh==='both'?G.R:G[G.fresh],p=G.p,a=Math.floor(it.v/p.step)*p.step,n=nm(it);

function mmGuess(){
 if(!G.sel)return;

 // Only the knocked-out card reveals its number; the winner's stays hidden until the recap.
 const wTxt=p.higher?T(`more than ${Lo.v.toLocaleString(loc())} ${L(p.unit)}`,`mais de ${Lo.v.toLocaleString(loc())} ${L(p.unit)}`):T(`before ${Lo.v}`,`antes de ${Lo.v}`);
 $('#verdict').innerHTML=`<h2 class="fade ${ok?'ok':'no'}">${ok?'Golaço!':'Na trave!'}<small>${ok?T("That's right",'Acertou'):T('Not quite','Quase')}</small></h2><div class="box fade"><span class="vals"><span class="w">${nm(W)} · ${wTxt}</span><span class="out">${nm(Lo)} · ${fmtV(p,Lo.v)}</span></span><span id="ft"></span></div>`;
 syncText($('#ft'),Lo.f,.8);

}

function tkDrag(el,src){
 el.onpointerdown=e=>{
  if(TS.solved||e.button>0)return;
  const card=src==='deck'?TS.deck[0]:TS.slots[src];
  const sx=e.clientX,sy=e.clientY;let ghost=null,target=null;
  el.setPointerCapture?.(e.pointerId);
  const mv=ev=>{
   if(!ghost&&card!=null&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=document.createElement('div');ghost.className='tk-ghost';ghost.innerHTML=tCard(TS.ri,TS.r.cards[card],card);document.body.appendChild(ghost);el.style.opacity=.35}
   if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
    const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.tk-slot');
    document.querySelectorAll('.tk-slot.target').forEach(x=>x.classList.remove('target'));
    target=hit&&!TS.locked[+hit.dataset.s]?hit:null;if(target)target.classList.add('target')}
  };
  const up=ev=>{
   el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
   if(ghost){ghost.remove();el.style.opacity='';
    if(target)tkMove(src,+target.dataset.s);
    else if(src!=='deck'&&document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.tk-deck'))tkToDeck(src);
    tkRender();}
   else tkTap(src);
  };
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 };
}
function tkMove(src,t){

 if(src==='deck'){if(!TS.deck.length)return;TS.slots[t]=TS.deck.shift();if(ex!=null)TS.deck.unshift(ex)}
 else{TS.slots[t]=TS.slots[src];TS.slots[src]=ex}
}
function tkToDeck(s){TS.wrong=TS.wrong.filter(x=>x!==s);if(TS.slots[s]!=null){TS.deck.unshift(TS.slots[s]);TS.slots[s]=null}}
function tkTap(src){

function c10Compare(g,m){
 const nat=g[1]===m[1]?2:CONT_OF(g[1])===CONT_OF(m[1])?1:0;
 const pos=g[2]===m[2]?2:SECTOR[g[2]]===SECTOR[m[2]]?1:0;

 const mLeagues=new Set(m[3].map(leagueOf));

 const club=shared.length?2:sharedLg.length?1:0;
 // Debut: same decade = right, within 20 years = close. The arrow says whether the mystery player started later or earlier.
 const year=decade(g[4])===decade(m[4])?2:Math.abs(g[4]-m[4])<=20?1:0;
 const dir=m[4]>g[4]?'up':m[4]<g[4]?'down':'';
 return {nat,pos,club,year,dir,shared,sharedLg};
}

/* ---------- photo viewer: zoom with scroll, pinch, double-click or + and −; drag to look around ---------- */
class PanZoom{
 constructor(el,img){this.el=el;this.img=img;this.z=1;this.tx=0;this.ty=0;this.bind();this.ro=new ResizeObserver(()=>this.set(this.z,this.tx,this.ty));this.ro.observe(el)}
 set(z,tx,ty){const W=this.el.clientWidth,H=this.el.clientHeight;this.z=Math.max(1,Math.min(4,z));
  this.tx=Math.min(0,Math.max(W-W*this.z,tx));this.ty=Math.min(0,Math.max(H-H*this.z,ty));
  this.img.style.transform=`translate(${this.tx}px,${this.ty}px) scale(${this.z})`;this.el.classList.toggle('zoomed',this.z>1.01)}
 zoomAt(p,f){const z=Math.max(1,Math.min(4,this.z*f)),k=z/this.z;this.set(z,p[0]-(p[0]-this.tx)*k,p[1]-(p[1]-this.ty)*k)}
 bind(){
  const el=this.el,P=new Map();
  const loc=e=>{const r=el.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;try{el.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,loc(e))});
  el.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const before=[...P.values()].map(p=>p.slice()),cur=loc(e),prev=P.get(e.pointerId);P.set(e.pointerId,cur);
   if(P.size===1)this.set(this.z,this.tx+cur[0]-prev[0],this.ty+cur[1]-prev[1]);
   else if(P.size===2){const after=[...P.values()],mid=a=>[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],dist=a=>Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;
    const m0=mid(before),m1=mid(after);this.set(this.z,this.tx+m1[0]-m0[0],this.ty+m1[1]-m0[1]);this.zoomAt(m1,dist(after)/dist(before))}});
  const end=e=>P.delete(e.pointerId);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault();this.zoomAt(loc(e),Math.exp(-Math.max(-60,Math.min(60,e.deltaY))*.006))},{passive:false});
  el.addEventListener('dblclick',e=>{e.preventDefault();this.z>1.5?this.set(1,0,0):this.zoomAt(loc(e),2.5)});
 }
 destroy(){this.ro.disconnect()}
}

/* =================== ACCOUNTS, SYNC & FRIENDS (Supabase) ===================
   Off unless config.js holds a Supabase project. Then:
   · log in with Google or a 6-digit email code, pick a username
   · every finished game is saved as one row (game, day, result), so stats and streaks follow you to any device
   · friends: request by username, accept, then see each other's results (the database enforces it) */
const CFG=window.B2B_CONFIG||{};

const GAME_KEYS=['mm','tt','c10','var'];
const splitKey=k=>{const g=GAME_KEYS.find(g=>k.startsWith(g)&&/^\d+$/.test(k.slice(g.length)));return g?{g,n:+k.slice(g.length)}:null};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function recomputeKnow(){const k={};Object.values(store.res).forEach(r=>{if(r&&r.know&&r.know.p)r.know.t.forEach(t=>k[t]=(k[t]||0)+r.know.p)});store.know=k}

// ---- sync ----
let pushChain=Promise.resolve();
function cloudPush(){
 if(!sb||!session||syncedFor!==session.user.id)return;
 const uid=session.user.id,rows=[];
 Object.keys(store.res).forEach(k=>{if(pushed.has(k))return;const s=splitKey(k);if(!s)return;pushed.add(k);rows.push({user_id:uid,game:s.g,day:s.n,data:store.res[k]})});
 if(!rows.length)return;
 pushChain=pushChain.then(()=>sb.from('results').upsert(rows,{onConflict:'user_id,game,day'})).then(({error})=>{if(error){rows.forEach(r=>pushed.delete(r.game+r.day));syncNote='err'}else syncNote='ok'}).catch(()=>{rows.forEach(r=>pushed.delete(r.game+r.day));syncNote='err'});
}
async function syncAll(){
 const uid=session.user.id;
 const{data:rows,error}=await sb.from('results').select('game,day,data').eq('user_id',uid);
 if(error)throw error;
 pushed=new Set();
 rows.forEach(r=>{const k=r.game+r.day;if(!store.res[k])store.res[k]=r.data;pushed.add(k)});
 recomputeKnow();syncedFor=uid;save();syncNote='ok';
}

async function loadSocial(){

 const{data:links,error}=await sb.from('friendships').select('requester,addressee,status,created_at');if(error)throw error;
 const m=myId(),other=l=>l.requester===m?l.addressee:l.requester,ids=[...new Set(links.map(other))],names={},res={};
 if(ids.length){
  const{data:ps,error:e1}=await sb.from('profiles').select('id,username').in('id',ids);if(e1)throw e1;ps.forEach(p=>names[p.id]=p.username);

   fr.forEach(f=>res[f]={});rows.forEach(r=>{(res[r.user_id]||(res[r.user_id]={}))[r.game+r.day]=r.data})}
 }

function socialLists(){

 return{friends:L.filter(l=>l.status==='accepted').map(other).sort(byName),incoming:L.filter(l=>l.status==='pending'&&l.addressee===m).map(l=>l.requester).sort(byName),outgoing:L.filter(l=>l.status==='pending'&&l.requester===m).map(l=>l.addressee).sort(byName)};

async function sendRequest(raw){

 if(!/^[A-Za-z0-9_]{3,16}$/.test(name))return{err:T('Usernames have 3 to 16 letters, numbers or _.','Nomes de usuário têm de 3 a 16 letras, números ou _.')};
 if(profile&&name.toLowerCase()===profile.username.toLowerCase())return{err:T("That's you! Try a friend's username.",'Esse é você! Digite o nome de um amigo.')};
 const{data:p,error}=await sb.from('profiles').select('id,username').ilike('username',name.replace(/[\\%_]/g,c=>'\\'+c)).maybeSingle();
 if(error)return{err:T("Couldn't search now. Check your connection.",'Não deu para buscar agora. Confira sua conexão.')};
 if(!p)return{err:T(`Nobody called ${name}. Check the spelling.`,`Ninguém se chama ${name}. Confira a grafia.`)};

 if(L.friends.includes(p.id))return{err:T(`You and ${p.username} are already friends.`,`Você e ${p.username} já são amigos.`)};

 await loadSocial().catch(()=>{});
 return{ok:T(`Request sent to ${p.username}.`,`Pedido enviado para ${p.username}.`)};
}

function bestOf(res){const on=n=>GAME_KEYS.some(g=>res[g+n]&&res[g+n].onDay);let b=0,c=0;for(let n=1;n<=todayNum();n++){c=on(n)?c+1:0;b=Math.max(b,c)}return b}
function sumOf(res){

 Object.keys(res).forEach(k=>{const s=splitKey(k);if(!s)return;const p=resPen(s.g,res[k]),t=tier(p);o.played++;o.days.add(s.n);o.g[s.g].n++;o.g[s.g].pts+=t.k==='cup'?4:t.k==='out'?0:4-t.n;if(t.k==='cup'){o.cups++;o.g[s.g].cups++}});

function usernameScreen(first){
 subScreen(T('Username','Nome de usuário'),`
  <h1 class="h1">${first?T('Pick a username','Escolha seu nome'):T('Change username','Mudar nome')}</h1><p class="lede">${T('Friends find you by it. 3 to 16 letters, numbers or _.','Seus amigos te acham por ele. De 3 a 16 letras, números ou _.')}</p>
  <form id="uform" class="acol" novalidate><label class="fl" for="auser">${T('Username','Nome de usuário')}</label><input id="auser" class="ain" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="16" value="${esc(profile?profile.username:'')}" required><button class="btn" type="submit">${T('Save','Salvar')}</button></form>
  <p class="amsg" id="amsg" role="status"></p>`,first?home:accountScreen);
 $('#auser').focus();
 $('#uform').onsubmit=async e=>{e.preventDefault();const name=$('#auser').value.trim();
  if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){amsg(T('Use 3 to 16 letters, numbers or _.','Use de 3 a 16 letras, números ou _.'),true);return}
  abusy(true);amsg(T('Saving…','Salvando…'));
  const{error}=await sb.from('profiles').upsert({id:session.user.id,username:name});abusy(false);
  if(error){amsg(error.code==='23505'?T('That name is taken. Try another.','Esse nome já existe. Tente outro.'):error.message,true);return}
  profile={username:name};first?home():accountScreen()};

function friendsScreen(){

 REDRAW=friendsScreen;app.classList.remove('wide');

function friendScreen(id){
 const them=social.res[id]||{},me=store.res,A=sumOf(me),B=sumOf(them),n=todayNum();
 // head to head: on days you both played a game, the better medal wins
 let w=0,l=0,d=0;const per={};GAME_KEYS.forEach(g=>per[g]=[0,0,0]);
 Object.keys(me).forEach(k=>{const s=splitKey(k);if(!s||!them[k])return;const a=resPen(s.g,me[k]),b=resPen(s.g,them[k]),i=a<b?0:a>b?1:2;per[s.g][i]++;[()=>w++,()=>l++,()=>d++][i]()});
 const nm=esc(nameOf(id)),G=GAMES.map(x=>x.g);
 const row=(lbl,a,b,lowWins)=>{const av=+a,bv=+b,wa=isFinite(av)&&isFinite(bv)&&(lowWins?av<bv:av>bv),wb=isFinite(av)&&isFinite(bv)&&(lowWins?bv<av:bv>av);return`<div class="crow"><b class="${wa?'win':''}">${a}</b><span>${lbl}</span><b class="${wb?'win':''}">${b}</b></div>`};
 const today=GAME_KEYS.map(g=>{const a=me[g+n],b=them[g+n];return`<div class="crow"><span class="cm">${a?award(resPen(g,a)):'–'}</span><span>${GAMES.find(x=>x.g===g).name}</span><span class="cm">${b?(a?award(resPen(g,b)):VAR_IC.lock):'–'}</span></div>`}).join('');
 const avg=(S,g)=>S.g[g].n?(S.g[g].pts/S.g[g].n).toFixed(1):'–';
 subScreen(T('Compare','Comparar'),`
  <div class="vs"><div><span class="aav">${esc(profile.username[0].toUpperCase())}</span><b>${esc(profile.username)}</b></div><span class="vsx">${w}–${l}${d?`–${d}`:''}</span><div><span class="aav b">${nm[0].toUpperCase()}</span><b>${nm}</b></div></div>
  <p class="fnote" style="text-align:center">${T('Wins, losses and draws on the games you both played.','Vitórias, derrotas e empates nos jogos que vocês dois jogaram.')}</p>
  <div class="sec"><h3>${T('Today','Hoje')}</h3><div class="crows">${today}</div></div>
  <div class="sec"><h3>${T('Overall','Geral')}</h3><div class="crows">
   ${row(T('Days played','Dias jogados'),A.days.size,B.days.size)}${row(T('Trophies','Troféus'),A.cups,B.cups)}${row(T('Current streak','Sequência atual'),streakOf(me),streakOf(them))}${row(T('Best streak','Melhor sequência'),bestOf(me),bestOf(them))}</div></div>
  <div class="sec"><h3>${T('By game','Por jogo')}</h3><div class="crows">
   ${G.map(g=>`<div class="crow sub"><span></span><span>${GAMES.find(x=>x.g===g).name} · ${per[g][0]}–${per[g][1]}${per[g][2]?`–${per[g][2]}`:''}</span><span></span></div>${row(T('Trophies','Troféus'),A.g[g].cups,B.g[g].cups)}${row(T('Avg points (0–4)','Média de pontos (0–4)'),avg(A,g),avg(B,g))}`).join('')}</div></div>
  <button class="btn ghost danger" id="frm" style="flex:none;width:100%;margin-top:18px">${T('Remove friend','Remover amigo')}</button><p class="amsg" id="amsg" role="status"></p>`,friendsScreen);
 let armed=false;$('#frm').onclick=async()=>{if(!armed){armed=true;$('#frm').textContent=T('Tap again to remove','Toque de novo para remover');return}abusy(true);const r=await removeLink(id);if(r.err){abusy(false);amsg(r.err,true)}else friendsScreen()};
}

   After the first game finished on the day, a full screen shows the streak growing, with the week below. */
const playedOn=n=>!!(R('mm',n)?.onDay||R('tt',n)?.onDay||R('c10',n)?.onDay||R('var',n)?.onDay);
const FLAME_BIG=`<svg viewBox="0 0 120 140" aria-hidden="true"><defs><linearGradient id="flA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A3C"/><stop offset="1" stop-color="#EE4518"/></linearGradient><linearGradient id="flB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFB23F"/></linearGradient></defs><path d="M62 4c4 24 40 38 40 82a42 42 0 0 1-84 0c0-22 12-34 20-44 2 12 8 20 15 22-5-24 2-44 9-60z" fill="url(#flA)" stroke="#1A0E06" stroke-width="3.5" stroke-linejoin="round"/><path d="M61 56c4 15 23 23 23 42a23 23 0 0 1-46 0c0-12 6-18 10-23 1 6 4 10 8 11-3-12 1-22 5-30z" fill="url(#flB)"/></svg>`;
const FLAME_SM='<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12.4 1.5c.8 4.8 8 7.6 8 16.4a8.4 8.4 0 0 1-16.8 0c0-4.4 2.4-6.8 4-8.8.4 2.4 1.6 4 3 4.4-1-4.8.4-8.8 1.8-12z" fill="#FF8A2B" stroke="#1A0E06" stroke-width="1.4" stroke-linejoin="round"/><path d="M12.2 12c.8 3 4.6 4.6 4.6 8.4a4.6 4.6 0 0 1-9.2 0c0-2.4 1.2-3.6 2-4.6.2 1.2.8 2 1.6 2.2-.6-2.4.2-4.4 1-6z" fill="#FFD25E"/></svg>';
function afterGame(){const n=todayNum();if(playedOn(n)&&store.streakSeen!==n){store.streakSeen=n;save();streakScreen()}else home()}
function streakScreen(){
 const n=todayNum(),s=streak(),dow=new Date().getDay(),letters=T('SMTWTFS','DSTQQSS');
 let week='';
 for(let i=0;i<7;i++){const k=n-dow+i,today=i===dow,on=k>=1&&k<=n&&playedOn(k);
  week+=`<div class="sk-d${today?' today':''}"><span>${letters[i]}</span><i class="${on?'on':k>n?'fut':'off'}">${on?FLAME_SM:''}${today&&on?'<b class="sk-ck">'+ICON.check+'</b>':''}</i></div>`}
 const games=[['mm','Mata-Mata',()=>mmIntro(n),!!mmP(n)],['tt','Tiki-Taka',()=>ttStart(n),!!tkDay(n)],['c10','Camisa 10',()=>c10Start(n),!!c10Day(n)],['var','VAR',()=>varStart(n),!!varDay(n)]];
 const next=games.find(g=>g[3]&&!R(g[0],n));
 app.classList.remove('wide');try{window.scrollTo(0,0)}catch(e){}
 app.innerHTML=`<section class="screen streak-scr"><div class="spacer"></div>
  <div class="sk-hero"><div class="sk-glow"></div><div class="sk-flame">${FLAME_BIG}</div>${[[-70,-90],[64,-104],[-92,-20],[88,-34],[-40,-130],[30,-140]].map(([x,y],i)=>`<i class="sk-spark" style="--dx:${x}px;--dy:${y}px;animation-delay:${.75+i*.05}s"></i>`).join('')}<b class="sk-num" id="sknum">${Math.max(0,s-1)}</b></div>
  <h2 class="sk-lbl">${s===1?T('Day streak','Dia seguido'):T('Day streak','Dias seguidos')}</h2>
  <div class="sk-week">${week}</div>
  <p class="sk-msg">${T('Come back tomorrow to keep it going.','Volte amanhã para manter a sequência.')}</p>
  <div class="spacer"></div>
  ${next?`<button class="btn sk-next" id="sknext">${T('Play','Jogar')} ${next[1]}</button>`:''}
  <button class="textbtn" id="skx">${T('Close','Fechar')}</button></section>`;
 setTimeout(()=>{const e=$('#sknum');if(e){e.textContent=s;e.classList.add('bump')}},620);
 if(next)$('#sknext').onclick=next[2];$('#skx').onclick=home;
}
